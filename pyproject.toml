[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-webapi-mcp"
version = "0.1.0"
description = "MCP server for Google Gemini — free image generation and chat via browser cookies"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "AndyShaman" },
]
keywords = ["mcp", "mcp-server", "gemini", "google-gemini", "ai", "image-generation", "llm", "claude", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
# PINNED FOR DISTRIBUTION (ciro-rosa) — audited 2026-06-01.
# Engine pinned to ciro-rosa/Gemini-API @ audited commit 4402e52 (immutable SHA).
# Direct deps pinned to the exact versions audited so no upstream push/release
# reaches students without re-review. See SECURITY-AUDIT.md.
dependencies = [
    # tag v1.19.3 == audited commit 4402e5231760a1e85e28eb6cd0040ff302b764de (immutable on this fork)
    "gemini-webapi @ git+https://github.com/ciro-rosa/Gemini-API.git@v1.19.3",
    "mcp==1.27.2",
    "browser-cookie3==0.20.1",
    "orjson==3.11.9",
    "Pillow==12.2.0",
    "numpy==2.4.6",
    "curl-cffi==0.15.0",
]

[project.scripts]
gemini-webapi-mcp = "gemini_webapi_mcp:main"

[project.urls]
Homepage = "https://github.com/AndyShaman/gemini-webapi-mcp"
Repository = "https://github.com/AndyShaman/gemini-webapi-mcp"
Issues = "https://github.com/AndyShaman/gemini-webapi-mcp/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_webapi_mcp"]
